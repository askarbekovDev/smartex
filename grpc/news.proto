syntax = "proto3";

package news;

message GetNewsRequest {
  uint32 offset = 1;
}

message NewsItem {
  uint32 id = 1;
  string date = 2;
  string title = 3;
  string text = 4;
  string img = 5;
}

message GetNewsResponse {
  repeated NewsItem newsItems = 1;
}

service News {
  rpc Get(GetNewsRequest) returns (GetNewsResponse) {}
}
